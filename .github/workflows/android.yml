name: Build Android APK

on:
  push:
    branches: [main, master, vibe/fully-offline-c73d38]
    paths-ignore:
      - 'mono/**'
      - 'docs/MONO.md'
      - '.github/workflows/monogame.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files (fully offline)
        run: |
          mkdir -p www
          cp src/index.html www/index.html
          cp -r src/vendor www/vendor
          grep -q 'src="vendor/three.min.js"' www/index.html
          if grep -qE '(src|href)="https?://|url\(https?://' www/index.html; then
            echo 'External URL found in web files'; exit 1
          fi
          python3 tools/check_i18n.py www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject native Unity Ads plugin
        run: bash native/inject_native.sh

      - name: Customize Android project
        run: |
          RES=android/app/src/main/res
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="fullSensor"/' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' $M
          sed -i '/name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>' $RES/values/styles.xml
          for d in icons/mipmap-*/; do cp -r "$d" "$RES/"; done
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#6FD3FF</color></resources>' > $RES/values/ic_launcher_background.xml
          find $RES -name 'splash.png' -exec cp icons/splash.png {} \;
          rm -f $RES/splash.png
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon; then ok=1; break; fi
            if [ $i -eq 3 ]; then break; fi
            echo "Transient dependency failure (attempt $i) — retrying in 45s..."
            sleep 45
          done
          [ $ok -eq 1 ] || exit 1

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          elif [ -f tools/release.p12 ]; then
            echo "Using the committed signing key (tools/release.p12) — same signature on every build"
            cp tools/release.p12 release.jks
            KS_PASS=${KS_PASS:-tipsybird2026}; KEY_ALIAS=${KEY_ALIAS:-tipsy}
          else
            echo "No keystore secret found: creating a temporary one (add secrets to keep the same signature between builds)"
            KS_PASS=tipsybird123; KEY_ALIAS=tipsy
            keytool -genkeypair -keystore release.jks -alias $KEY_ALIAS -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass $KS_PASS -keypass $KS_PASS -dname "CN=Tipsy Bird, O=Tipsy, C=US"
          fi
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          export KS_PASS
          $BT/apksigner sign --ks release.jks --ks-key-alias $KEY_ALIAS --ks-pass env:KS_PASS --out TipsyBird3D.apk aligned.apk
          $BT/apksigner verify TipsyBird3D.apk

      - name: Share APK (release + direct link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          NOTES="APK جاهز بميزة الإعلانات (Unity Ads 4.22.0) — بناء #${{ github.run_number }} (${GITHUB_REF_NAME})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" TipsyBird3D.apk --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" TipsyBird3D.apk --title "Tipsy Bird 3D — Build #${{ github.run_number }}" --notes "$NOTES" --latest
          fi
          URL=$(gh release view "$TAG" --repo $GITHUB_REPOSITORY --json url -q .url)
          echo "APK shared: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "### رابط مشاركة الـ APK" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "رابط مباشر: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/TipsyBird3D.apk" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: TipsyBird3D-apk
          path: TipsyBird3D.apk
