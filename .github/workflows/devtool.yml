name: Build DevTools APK

on:
  push:
    branches: [main, master, vibe/fully-offline-c73d38]
    paths:
      - 'devtool/**'
      - '.github/workflows/devtool.yml'
  workflow_dispatch:

concurrency:
  group: devtool-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compile + package DevTools APK (aapt2 + javac + d8, no gradle)
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          PLAT=$(ls -d $ANDROID_HOME/platforms/* | sort -V | tail -1)
          echo "Using $BT / $PLAT"
          $BT/aapt2 compile --dir devtool/res -o /tmp/res.zip
          $BT/aapt2 link -o /tmp/base.apk -I $PLAT/android.jar \
            --manifest devtool/AndroidManifest.xml \
            --min-sdk-version 23 --target-sdk-version 34 \
            --version-code ${{ github.run_number }} --version-name 1.0 \
            /tmp/res.zip
          $BT/aapt2 dump badging /tmp/base.apk | grep "package: name='com.tipsybird.devtool'"
          javac -classpath $PLAT/android.jar -d /tmp/classes $(find devtool/src -name '*.java')
          mkdir -p /tmp/dex
          $BT/d8 --release --lib $PLAT/android.jar --min-api 23 --output /tmp/dex $(find /tmp/classes -name '*.class')
          test -f /tmp/dex/classes.dex
          mkdir -p /tmp/stage
          cp /tmp/base.apk /tmp/stage/
          cd /tmp/stage && zip -j base.apk /tmp/dex/classes.dex
          $BT/zipalign -p -f 4 /tmp/stage/base.apk /tmp/stage/aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          else
            cp tools/release.p12 release.jks
            KS_PASS=${KS_PASS:-tipsybird2026}; KEY_ALIAS=${KEY_ALIAS:-tipsy}
          fi
          export KS_PASS
          $BT/apksigner sign --ks release.jks --ks-key-alias $KEY_ALIAS --ks-pass env:KS_PASS --out TipsyBirdDevTools.apk /tmp/stage/aligned.apk
          $BT/apksigner verify TipsyBirdDevTools.apk
          test "$(unzip -p TipsyBirdDevTools.apk classes.dex | head -c 3)"; echo "classes.dex present"

      - name: Share APK (dev-N release + artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dev-${{ github.run_number }}"
          NOTES="🛠️ Tipsy DevTools — build #${{ github.run_number }}
          تطبيق أدوات المطورين المنفصل: مراقبة بناءات اللعبة + روابط APK مباشرة + إصدارات dev-N + نصوص النشر AR/EN + سجل المراحل وقائمة التحقق."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" TipsyBirdDevTools.apk --clobber
          else
            gh release create "$TAG" TipsyBirdDevTools.apk --title "Tipsy DevTools — Build #${{ github.run_number }}" --notes "$NOTES"
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/TipsyBirdDevTools.apk" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: TipsyBirdDevTools-apk
          path: TipsyBirdDevTools.apk
