name: Create Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Add the two secrets first: KEY_ALIAS and KEYSTORE_PASSWORD"
            exit 1
          fi
          keytool -genkeypair -v -keystore release.jks -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Tipsy Bird 3D, OU=Games, O=WorldNewsPortal, C=US"
          base64 -w0 release.jks > release.b64
          echo "### Copy the single line below into the KEYSTORE_BASE64 secret" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          cat release.b64 >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "base64 length: $(wc -c < release.b64) chars"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.jks
          retention-days: 1
