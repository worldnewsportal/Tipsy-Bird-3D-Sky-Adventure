name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prepare web files (offline Three.js)
        run: |
          mkdir -p www
          cp src/index.html www/index.html
          cp node_modules/three/build/three.min.js www/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' www/index.html
          sed -i '/fonts.googleapis.com/d' www/index.html
          grep -q 'src="three.min.js"' www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Customize Android project
        run: |
          RES=android/app/src/main/res
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' $M
          sed -i '/name="AppTheme.NoActionBar"/a\        <item name="android:windowFullscreen">true</item>' $RES/values/styles.xml
          cp -r icons/. $RES/
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#6FD3FF</color></resources>' > $RES/values/ic_launcher_background.xml
          find $RES -name 'splash.png' -exec cp icons/splash.png {} \;
          rm -f $RES/splash.png
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          else
            echo "No keystore secret found: creating a temporary one (add secrets to keep the same signature between builds)"
            KS_PASS=tipsybird123; KEY_ALIAS=tipsy
            keytool -genkeypair -keystore release.jks -alias $KEY_ALIAS -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass $KS_PASS -keypass $KS_PASS -dname "CN=Tipsy Bird, O=Tipsy, C=US"
          fi
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          $BT/zipalign -p -f 4 $IN aligned.apk
          export KS_PASS
          $BT/apksigner sign --ks release.jks --ks-key-alias $KEY_ALIAS --ks-pass env:KS_PASS --out TipsyBird3D.apk aligned.apk
          $BT/apksigner verify TipsyBird3D.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TipsyBird3D-apk
          path: TipsyBird3D.apk
